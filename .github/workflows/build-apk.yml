name: Build FireBolt Sync APK

on:
  workflow_dispatch:
  push:
    branches: [main, fix/android-build-errors]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q FireBoltSync-Android-Project.zip -d project

      - name: Fix Android compile errors in starter source
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/fireboltsync/app/MainActivity.kt")
          source = p.read_text()
          import_line = "import androidx.activity.compose.rememberLauncherForActivityResult\n"
          set_content_import = "import androidx.activity.compose.setContent\n"
          if set_content_import not in source:
              if import_line not in source:
                  raise SystemExit("Could not find Compose activity-result import anchor")
              source = source.replace(import_line, import_line + set_content_import, 1)
          source = source.replace(
              "android.os.Handler(mainLooper).postDelayed({",
              "android.os.Handler(activity.mainLooper).postDelayed({"
          )
          p.write_text(source)
          PY

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireBoltSync-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
